name: Disney 621 character image importer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'fetch = download candidates; publish = publish manually selected images'
        required: true
        default: fetch
        type: choice
        options:
          - fetch
          - publish
          - status
      limit:
        description: 'Fetch at most N characters; 0 means all 366'
        required: true
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: disney-image-import-621
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install 'Pillow>=10,<13'
      - name: Fetch candidates or publish approved images
        env:
          IMPORT_MODE: ${{ inputs.mode }}
          IMPORT_LIMIT: ${{ inputs.limit }}
        run: python image_import_621.py "$IMPORT_MODE" --limit "$IMPORT_LIMIT"
      - name: Commit result to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/
          if ! git diff --cached --quiet; then
            git commit -m "Update reviewed Disney character image candidates"
            git push
          else
            echo "No new images or manifest changes."
          fi
